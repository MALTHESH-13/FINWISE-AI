<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashPilot - Login / Sign Up</title>
  <link rel="stylesheet" href="/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <h1 class="brand-title">CashPilot</h1>
        <p class="brand-tagline">Know where your money is going, not just where it went</p>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" type="button">Log In</button>
        <button id="tab-signup" class="tab-btn" type="button">Sign Up</button>
      </div>

      <div id="error-message" class="inline-error" style="display: none;"></div>

      <form id="auth-form" novalidate>
        <div id="name-group" class="form-group" style="display: none;">
          <label for="name-input">Full Name</label>
          <input type="text" id="name-input" placeholder="e.g. John Doe" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email-input">Email Address</label>
          <input type="email" id="email-input" placeholder="name@company.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password-input">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password-input" placeholder="At least 8 characters" autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="toggle-pw-btn" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <small id="pw-hint" class="field-hint">Must be at least 8 characters</small>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">
          <span class="btn-text">Log In</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" id="demo-btn" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Continue with demo account</span>
      </button>

      <div class="demo-cred-note">
        <span>Demo user: <strong>demo@cashpilot.app</strong> / <strong>demo1234</strong></span>
      </div>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
